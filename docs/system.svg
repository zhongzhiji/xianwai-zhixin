<text x="100" y="176" font-size="52" font-weight="bold">弦外之芯 蓝牙接入与音游展示</text>
<text x="100" y="230" font-size="24" fill="#a6b9cf">曲谱和音符按事件传输，板上音频由 FPGA 实时合成。</text>
